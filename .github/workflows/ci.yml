name: CI

# Lint, offline tests and the deterministic evaluation harness. No step needs an API key
# or network access beyond dependency installation: tests block outbound sockets.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Lint, tests and offline eval
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOOGLE_API_KEY: ''
      GEMINI_API_KEY: ''
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install uv (pinned)
        run: python -m pip install uv==0.11.7
      - name: Lockfile matches pyproject.toml
        run: uv lock --check
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Ruff lint and format check
        run: |
          uv run ruff check
          uv run ruff format --check
      - name: Offline test suite
        run: uv run pytest -v
      - name: Offline evaluation harness
        run: uv run python -m eval.runner
